services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruit"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sable
      MINIO_ROOT_PASSWORD: sable-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  be:
    build: ./be
    env_file: .env
    environment:
      DATABASE_URL: postgres://recruit:recruit@postgres:5432/recruit
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_BUCKET: sable-resumes
      S3_ACCESS_KEY_ID: sable
      S3_SECRET_ACCESS_KEY: sable-minio-dev
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
      S3_CREATE_BUCKET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "43124:8000"

  worker:
    build: ./be
    env_file: .env
    environment:
      DATABASE_URL: postgres://recruit:recruit@postgres:5432/recruit
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_BUCKET: sable-resumes
      S3_ACCESS_KEY_ID: sable
      S3_SECRET_ACCESS_KEY: sable-minio-dev
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
      S3_CREATE_BUCKET: "true"
    command: celery -A config worker --loglevel=info
    depends_on:
      be:
        condition: service_started
      redis:
        condition: service_healthy

  fe:
    build: ./fe
    depends_on:
      - be
    ports:
      - "43123:80"

volumes:
  pgdata:
  miniodata:
